<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinical MCQs v1.2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

:root{--bg:#F2F5F4;--panel:#FFFFFF;--ink:#1B2733;--mute:#5B6B78;--line:#D5DDE0;--accent:#0E6E6E;--accent-ink:#FFFFFF;--good:#17703F;--goodbg:#E3F3EA;--bad:#A8322B;--badbg:#FBE7E5;--flag:#B4530A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11181C;--panel:#192127;--ink:#E6EDF0;--mute:#93A3AE;--line:#2C3943;--accent:#4FC3C3;--accent-ink:#0B1A1A;--good:#5BD08F;--goodbg:#12301F;--bad:#FF8A80;--badbg:#3A1917;--flag:#F0A45B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11181C;--panel:#192127;--ink:#E6EDF0;--mute:#93A3AE;--line:#2C3943;--accent:#4FC3C3;--accent-ink:#0B1A1A;--good:#5BD08F;--goodbg:#12301F;--bad:#FF8A80;--badbg:#3A1917;--flag:#F0A45B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
h1{font:600 20px/1.2 "Newsreader",Georgia,serif;margin:0}
.meta{color:var(--mute);font-size:14px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.topic{color:var(--accent);font-weight:600;font-size:14px;margin:0 0 8px}
.case{font:400 19px/1.6 "Newsreader",Georgia,serif;margin:0 0 16px}
.labs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
.labs div{background:var(--panel);padding:8px 10px}
.labs b{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.labs span{font-weight:600}
.labs small{color:var(--mute);font-weight:400;font-size:12px}
.labs .hi span,.labs .lo span{color:var(--flag)}
.q{font-weight:600;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.theme:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;width:24px;height:24px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--mute)}
.opt:disabled{cursor:default}
.opt.right{background:var(--goodbg);border-color:var(--good)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--panel)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.opt.dim{opacity:.6}
.why{margin-top:16px;padding:14px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0}
.why p{margin:0}.why p+p{margin-top:8px}
.verdict{font-weight:600}
.row{display:flex;justify-content:flex-end;margin-top:16px;gap:8px}
.btn{font:600 15px "IBM Plex Sans",sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 20px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.theme{background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;font:inherit;font-size:13px;padding:3px 8px;cursor:pointer}
.score{font:600 44px/1.1 "Newsreader",Georgia,serif;margin:4px 0 6px}
.miss{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.miss li{border:1px solid var(--line);border-radius:8px;padding:12px}
.miss b{display:block;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:16px 0}
.sub{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sub.on{border-color:var(--accent)}
.sub h2{font:600 19px/1.2 "Newsreader",Georgia,serif;margin:0}
.sub label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);cursor:pointer}
.sub .btn{margin-top:auto}
.btn:disabled{opacity:.5;cursor:not-allowed}

header{flex-wrap:wrap}
.ver{font:600 12px "IBM Plex Sans",sans-serif;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:1px 7px;vertical-align:middle;margin-left:6px}
#nav{display:flex;gap:4px}
#nav button{font:600 14px "IBM Plex Sans",sans-serif;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:6px 10px;cursor:pointer}
#nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
#nav button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 22px}
.hero h2{font:600 30px/1.2 "Newsreader",Georgia,serif;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-top:22px}
.stats div{border-top:2px solid var(--accent);padding-top:8px}
.stats b{display:block;font:600 24px "Newsreader",Georgia,serif}
.stats span{color:var(--mute);font-size:13px}
.sec{font:600 20px "Newsreader",Georgia,serif;margin:28px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 15px "IBM Plex Sans",sans-serif;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip small{color:var(--mute);margin-left:8px}
.chip:hover{border-color:var(--accent)}
.schools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.school{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.school svg{display:block;width:100%;height:auto}
.school .body{padding:12px 14px 16px}
.school h3{font:600 16px/1.25 "Newsreader",Georgia,serif;margin:0 0 2px}
.school blockquote{margin:12px 0 0;padding-left:10px;border-left:3px solid var(--accent);font:italic 400 16px/1.45 "Newsreader",Georgia,serif}
.school cite{display:block;font:normal 500 13px "IBM Plex Sans",sans-serif;color:var(--mute);margin-top:6px}
.note{margin-top:20px}

.admin label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
.admin input,.admin textarea,.admin select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.admin textarea{min-height:76px;resize:vertical}
.tools{display:flex;justify-content:flex-end;margin-bottom:12px}
.card+.card{margin-top:16px}
.cq{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px}
.cq span{font-size:14px}

</style>
</head>
<body>
<main>
<header><h1>Clinical MCQs <span class="ver">v1.2</span></h1><nav id="nav" aria-label="Main"><button type="button" data-nav="home">Home</button><button type="button" data-nav="menu">Quizzes</button></nav><div><span class="meta" id="meta"></span> <button class="theme" id="theme" type="button">Dark</button></div></header>
<div class="bar"><i id="prog" style="width:0"></i></div>
<div id="app"></div>
</main>
<script>
var DATA={"Biochemistry": [{"t": "Carbohydrate metabolism", "c": "A 4-month-old girl has a seizure between feedings. She has a protuberant abdomen and a firm, enlarged liver. Fasting glucose is low and does not rise after glucagon.", "l": [["Glucose", "32 mg/dL", "70–100", "lo"], ["Lactate", "6.8 mmol/L", "0.5–2.2", "hi"], ["Uric acid", "9.1 mg/dL", "2.4–6.0", "hi"], ["Triglycerides", "520 mg/dL", "<150", "hi"]], "q": "Which enzyme is most likely deficient?", "o": ["Glucose-6-phosphatase", "Acid α-glucosidase", "Muscle glycogen phosphorylase", "Glycogen debranching enzyme"], "a": 0, "e": "This is von Gierke disease (GSD type I). Without glucose-6-phosphatase the liver cannot release free glucose from glycogenolysis or gluconeogenesis. Glucose-6-phosphate is diverted to lactate, uric acid and fat, explaining the labs."}, {"t": "Vitamins and cofactors", "c": "A 52-year-old man with chronic alcohol use is admitted confused and unsteady, with horizontal nystagmus and an ataxic gait. He was given IV dextrose in the ambulance and became worse.", "l": [["Glucose", "96 mg/dL", "70–100", ""], ["Lactate", "4.1 mmol/L", "0.5–2.2", "hi"], ["MCV", "104 fL", "80–100", "hi"]], "q": "Impaired activity of which enzyme is most directly responsible for his rising lactate?", "o": ["Pyruvate dehydrogenase", "Pyruvate carboxylase", "Lactate dehydrogenase", "Glucose-6-phosphate dehydrogenase"], "a": 0, "e": "This is Wernicke encephalopathy. Thiamine (B1) is a cofactor for pyruvate dehydrogenase, α-ketoglutarate dehydrogenase and transketolase. A glucose load increases pyruvate flux and demand for thiamine, so give thiamine before or with glucose."}, {"t": "Amino acid metabolism", "c": "A 6-month-old boy has a musty body odor, fair skin and light hair, and has lost developmental milestones. He was not screened at birth. Plasma phenylalanine is markedly elevated.", "l": [["Phenylalanine", "1,800 µmol/L", "<120", "hi"], ["Tyrosine", "Low", "", ""]], "q": "Which amino acid becomes conditionally essential in this disorder?", "o": ["Tyrosine", "Tryptophan", "Methionine", "Histidine"], "a": 0, "e": "Phenylalanine hydroxylase (or its cofactor tetrahydrobiopterin) is defective, so tyrosine cannot be made from phenylalanine and must be supplied in the diet. Low tyrosine reduces melanin, hence the fair skin."}, {"t": "Nucleotide metabolism", "c": "A 3-year-old boy has intellectual disability, dystonia and has bitten his lips and fingers. His diapers contain orange crystals. His older uncle has had severe gout since adolescence.", "l": [["Serum uric acid", "11.5 mg/dL", "2.4–6.0", "hi"], ["Inheritance", "X-linked", "", ""]], "q": "Which pathway is defective?", "o": ["Purine salvage", "De novo pyrimidine synthesis", "Urea cycle", "Pentose phosphate pathway"], "a": 0, "e": "Lesch-Nyhan syndrome is HGPRT deficiency. Hypoxanthine and guanine cannot be recycled, so PRPP accumulates, de novo purine synthesis rises, and uric acid overproduction follows."}, {"t": "Urea cycle", "c": "A 2-day-old boy becomes lethargic and vomits after starting feeds. He is tachypneic. Blood gas shows respiratory alkalosis. Ammonia is very high and BUN is low. His maternal uncle died in infancy.", "l": [["Ammonia", "540 µmol/L", "<50", "hi"], ["BUN", "Low", "", ""], ["pH", "7.52", "7.35–7.45", "hi"]], "q": "Which urine finding distinguishes ornithine transcarbamylase (OTC) deficiency from carbamoyl phosphate synthetase I deficiency?", "o": ["Elevated orotic acid", "Low glutamine", "Elevated citrulline", "Metabolic acidosis"], "a": 0, "e": "In OTC deficiency, mitochondrial carbamoyl phosphate spills into the cytosol and enters pyrimidine synthesis, raising orotic acid. In CPS I deficiency, orotic acid is normal or low."}, {"t": "Pentose phosphate pathway", "c": "A 24-year-old man develops dark urine, back pain and jaundice two days after starting an antimalarial and eating fava beans. A blood smear shows Heinz bodies and bite cells.", "l": [["Hemoglobin", "8.1 g/dL", "13.5–17.5", "lo"], ["Indirect bilirubin", "4.2 mg/dL", "<1.0", "hi"], ["LDH", "High", "", ""]], "q": "Reduced production of which molecule makes his red cells vulnerable to oxidative damage?", "o": ["NADPH", "ATP", "NADH", "FADH₂"], "a": 0, "e": "G6PD deficiency limits NADPH from the oxidative pentose phosphate pathway. NADPH keeps glutathione reduced, which detoxifies hydrogen peroxide. Without it, hemoglobin denatures into Heinz bodies and cells are hemolyzed."}, {"t": "Ketone bodies", "c": "A 17-year-old with type 1 diabetes stopped taking insulin. She has abdominal pain, fruity breath and deep rapid breathing. Glucose is 520 mg/dL and urine ketones are strongly positive.", "l": [["Glucose", "520 mg/dL", "70–100", "hi"], ["Bicarbonate", "8 mEq/L", "22–28", "lo"], ["pH", "7.12", "7.35–7.45", "lo"]], "q": "Depletion of which intermediate diverts hepatic acetyl-CoA toward ketone body synthesis?", "o": ["Oxaloacetate", "Citrate", "Succinate", "Malate"], "a": 0, "e": "With low insulin, fatty acid oxidation floods the liver with acetyl-CoA while oxaloacetate is drawn into gluconeogenesis. Acetyl-CoA cannot enter the TCA cycle and is converted to acetoacetate and β-hydroxybutyrate."}, {"t": "Lipid metabolism", "c": "A 28-year-old man has Achilles tendon xanthomas and a father who had a myocardial infarction at 42. Fasting LDL is 340 mg/dL. Genetic testing shows one defective LDL receptor allele. He is started on a statin.", "l": [["LDL", "340 mg/dL", "<100", "hi"], ["Triglycerides", "140 mg/dL", "<150", ""]], "q": "How does the statin lower his LDL?", "o": ["Inhibits HMG-CoA reductase, which upregulates hepatic LDL receptors", "Blocks intestinal cholesterol absorption", "Inhibits cholesteryl ester transfer protein", "Binds bile acids in the gut"], "a": 0, "e": "Statins inhibit HMG-CoA reductase, the rate-limiting step of cholesterol synthesis. Lower hepatocyte cholesterol activates SREBP-2, raising LDL receptor expression from the remaining normal allele and increasing LDL clearance."}, {"t": "Vitamins and cofactors", "c": "A 68-year-old man who lives alone and eats mostly tea and toast has bleeding gums, perifollicular hemorrhages and a wound that will not heal.", "l": [["Plasma vitamin C", "Very low", "", "lo"], ["Hemoglobin", "10.5 g/dL", "13.5–17.5", "lo"]], "q": "Which biochemical step is impaired?", "o": ["Hydroxylation of proline and lysine in procollagen", "Glycosylation of hydroxylysine in procollagen", "Cleavage of procollagen propeptides", "Disulfide bond formation in collagen chains"], "a": 0, "e": "Scurvy results from vitamin C deficiency. Ascorbate keeps the iron of prolyl and lysyl hydroxylase reduced, and hydroxylated residues are needed for stable collagen triple helices. Weak collagen causes bleeding and poor wound healing."}, {"t": "Lysosomal storage", "c": "A 30-year-old man has fatigue, bone pain and a massively enlarged spleen. Bone marrow biopsy shows macrophages with wrinkled, tissue-paper cytoplasm.", "l": [["Hemoglobin", "9.8 g/dL", "13.5–17.5", "lo"], ["Platelets", "70,000 /µL", "150,000–400,000", "lo"], ["β-glucosidase activity", "Low", "", "lo"]], "q": "Which substance accumulates in these macrophages?", "o": ["Glucocerebroside", "Sphingomyelin", "GM2 ganglioside", "Galactocerebroside"], "a": 0, "e": "Gaucher disease is glucocerebrosidase deficiency, so glucocerebroside builds up in macrophages (Gaucher cells). It causes hepatosplenomegaly, cytopenias and bone crises, and enzyme replacement therapy is available."}, {"t": "Vitamins and cofactors", "c": "A 50-year-old strict vegan has fatigue and numbness in both feet. He has a macrocytic anemia and reduced vibration sense.", "l": [["MCV", "112 fL", "80–100", "hi"], ["Methylmalonic acid", "Elevated", "", "hi"], ["Homocysteine", "Elevated", "", "hi"], ["Vitamin B12", "Low", "", "lo"]], "q": "Elevated methylmalonic acid reflects reduced activity of which enzyme?", "o": ["Methylmalonyl-CoA mutase", "Propionyl-CoA carboxylase", "Dihydrofolate reductase", "Cystathionine β-synthase"], "a": 0, "e": "Methylmalonyl-CoA mutase needs adenosylcobalamin, so B12 deficiency raises methylmalonic acid. B12 also drives homocysteine methyltransferase, so homocysteine rises too. In folate deficiency only homocysteine rises, which separates the two."}, {"t": "Heme synthesis", "c": "A 28-year-old woman has severe abdominal pain, anxiety and leg tingling after fasting for a diet and starting a sulfonamide. Her urine darkens on standing.", "l": [["Urine porphobilinogen", "Markedly elevated", "", "hi"], ["Urine ALA", "Elevated", "", "hi"], ["Skin findings", "None", "", ""]], "q": "Which enzyme is deficient?", "o": ["Porphobilinogen deaminase", "Uroporphyrinogen decarboxylase", "Ferrochelatase", "ALA dehydratase"], "a": 0, "e": "Acute intermittent porphyria is porphobilinogen deaminase deficiency. Fasting and drugs induce ALA synthase, raising ALA and porphobilinogen. Treatment is IV hemin and glucose. There is no photosensitivity, unlike porphyria cutanea tarda."}, {"t": "Fatty acid oxidation", "c": "A 9-month-old boy becomes lethargic and vomits after missing feeds during gastroenteritis. He is hypoglycemic with no ketones in the urine.", "l": [["Glucose", "28 mg/dL", "70–100", "lo"], ["Urine ketones", "Negative", "", "lo"], ["Urine dicarboxylic acids", "Elevated", "", "hi"]], "q": "Which enzyme is most likely deficient?", "o": ["Medium-chain acyl-CoA dehydrogenase", "Glucose-6-phosphatase", "Phenylalanine hydroxylase", "Ornithine transcarbamylase"], "a": 0, "e": "MCAD deficiency blocks β-oxidation during fasting, causing hypoketotic hypoglycemia and dicarboxylic aciduria. Management is avoiding fasting and giving glucose. Glycogen storage type I instead causes lactic acidosis and hyperuricemia."}], "Physiology": [{"t": "Cardiovascular physiology", "c": "A 34-year-old man arrives after a motorcycle collision with a femur fracture and heavy blood loss. He is pale, cool and clammy, with a thready pulse.", "l": [["Blood pressure", "82/50 mmHg", "90–120 systolic", "lo"], ["Heart rate", "128 /min", "60–100", "hi"], ["Hemoglobin", "7.4 g/dL", "13.5–17.5", "lo"], ["Lactate", "5.2 mmol/L", "0.5–2.2", "hi"]], "q": "Which change in the baroreceptor reflex explains his tachycardia?", "o": ["Decreased carotid sinus firing, causing more sympathetic and less parasympathetic outflow", "Increased carotid sinus firing, causing more sympathetic outflow", "Increased aortic arch firing, causing more vagal tone", "Decreased carotid sinus firing, causing more vagal tone"], "a": 0, "e": "Low arterial pressure reduces stretch of the carotid sinus (CN IX) and aortic arch (CN X) baroreceptors. Reduced afferent firing to the nucleus tractus solitarius raises sympathetic outflow and lowers vagal tone, increasing heart rate, contractility and vascular resistance."}, {"t": "Respiratory physiology", "c": "A 45-year-old woman, five days after abdominal surgery, develops sudden pleuritic chest pain and shortness of breath. She is tachycardic and her chest X-ray is clear.", "l": [["PaO₂", "62 mmHg", "80–100", "lo"], ["PaCO₂", "32 mmHg", "35–45", "lo"], ["Heart rate", "112 /min", "60–100", "hi"], ["D-dimer", "Elevated", "", "hi"]], "q": "In the lung region supplied by the obstructed artery, what happens to the V/Q ratio?", "o": ["It rises toward infinity (dead space)", "It falls toward zero (shunt)", "It stays near 0.8", "It rises only because ventilation increases"], "a": 0, "e": "With a pulmonary embolus, the alveoli are still ventilated but not perfused, so V/Q approaches infinity and the region becomes dead space. Hypoxemia follows because blood is diverted to the remaining lung, which lowers V/Q there."}, {"t": "Renal and acid-base physiology", "c": "A 58-year-old man has had five days of persistent vomiting from gastric outlet obstruction caused by a peptic ulcer. He is weak, with dry mucous membranes and postural hypotension.", "l": [["pH", "7.55", "7.35–7.45", "hi"], ["Bicarbonate", "36 mEq/L", "22–28", "hi"], ["Potassium", "2.8 mEq/L", "3.5–5.0", "lo"], ["Chloride", "84 mEq/L", "98–106", "lo"]], "q": "Which mechanism best explains his hypokalemia?", "o": ["Volume depletion raises aldosterone, increasing K⁺ secretion in the collecting duct", "Insulin deficiency shifts K⁺ out of cells", "Reduced distal tubular flow increases K⁺ secretion", "Inhibition of the Na⁺-K⁺-2Cl⁻ cotransporter"], "a": 0, "e": "Vomiting loses H⁺ and Cl⁻ and depletes volume, which activates the renin-angiotensin-aldosterone system. Aldosterone increases K⁺ and H⁺ secretion in the collecting duct, and alkalosis also shifts K⁺ into cells. Increased, not reduced, distal flow promotes K⁺ loss."}, {"t": "Endocrine physiology", "c": "A 25-year-old man develops marked thirst and passes about 6.5 L of urine daily after a severe head injury. After water deprivation his urine remains dilute.", "l": [["Serum sodium", "148 mEq/L", "136–145", "hi"], ["Serum osmolality", "310 mOsm/kg", "275–295", "hi"], ["Urine osmolality", "90 mOsm/kg", "Should rise on deprivation", "lo"]], "q": "Which result after giving desmopressin confirms central diabetes insipidus?", "o": ["Urine osmolality rises by more than 50%", "Urine osmolality does not change", "Urine osmolality falls further", "Serum sodium rises sharply"], "a": 0, "e": "In central DI the posterior pituitary releases too little ADH, but the collecting duct V2 receptors work. Desmopressin inserts aquaporin-2 channels and concentrates the urine. In nephrogenic DI the kidney does not respond."}, {"t": "Gastrointestinal physiology", "c": "A 48-year-old man with long-standing alcohol use has weight loss and greasy, foul-smelling stools. CT shows pancreatic calcifications.", "l": [["Fecal elastase", "60 µg/g", ">200", "lo"], ["Fecal fat", "Elevated", "", "hi"], ["Albumin", "3.0 g/dL", "3.5–5.0", "lo"]], "q": "In a healthy duodenum, which hormone released in response to acidic chyme stimulates pancreatic bicarbonate secretion?", "o": ["Secretin", "Cholecystokinin", "Gastrin", "Somatostatin"], "a": 0, "e": "S cells release secretin when acid enters the duodenum. It stimulates pancreatic duct cells to secrete bicarbonate, which neutralizes chyme so pancreatic enzymes work. Cholecystokinin responds to fat and protein and drives enzyme secretion and gallbladder contraction."}, {"t": "Cardiac physiology", "c": "A 62-year-old man with dilated cardiomyopathy has exertional dyspnea and leg edema. Echocardiography shows a dilated left ventricle with poor systolic function.", "l": [["Ejection fraction", "25%", "55–70", "lo"], ["LV end-diastolic volume", "260 mL", "100–150", "hi"], ["BNP", "1,450 pg/mL", "<100", "hi"]], "q": "Which pressure–volume loop change best explains his low stroke volume?", "o": ["Reduced contractility shifts the end-systolic point to a higher volume", "Reduced preload shifts the end-diastolic point to a lower volume", "Increased contractility shifts the end-systolic point to a lower volume", "Increased compliance lowers end-diastolic pressure"], "a": 0, "e": "Reduced contractility lowers the slope of the end-systolic pressure–volume relationship, so the ventricle cannot eject to its usual end-systolic volume. Stroke volume and ejection fraction fall. The raised end-diastolic volume is a Frank–Starling compensation that cannot fully restore output."}, {"t": "Renal physiology", "c": "A 68-year-old woman with heart failure takes furosemide and now has muscle cramps and tingling. She is otherwise euvolemic.", "l": [["Potassium", "3.1 mEq/L", "3.5–5.0", "lo"], ["Calcium", "8.3 mg/dL", "8.5–10.5", "lo"], ["Magnesium", "1.4 mg/dL", "1.7–2.2", "lo"]], "q": "What is the effect of furosemide on urinary calcium excretion, and why?", "o": ["It increases excretion by abolishing the lumen-positive potential in the thick ascending limb", "It decreases excretion by increasing distal tubule reabsorption", "It does not change excretion because calcium is reabsorbed only in the proximal tubule", "It increases excretion by blocking the Na⁺-Cl⁻ cotransporter in the distal tubule"], "a": 0, "e": "Furosemide blocks the Na⁺-K⁺-2Cl⁻ cotransporter in the thick ascending limb. This removes the lumen-positive potential that drives paracellular Ca²⁺ and Mg²⁺ reabsorption, so both are lost in urine. Thiazides, by contrast, reduce urinary calcium."}, {"t": "Respiratory physiology", "c": "A 30-year-old man climbs rapidly to 4,500 m. He has a headache and breathes deeply and fast.", "l": [["pH", "7.50", "7.35–7.45", "hi"], ["PaCO₂", "28 mmHg", "35–45", "lo"], ["PaO₂", "48 mmHg", "80–100", "lo"]], "q": "Which acid-base disturbance is present, and how does the kidney respond over days?", "o": ["Respiratory alkalosis; it excretes more bicarbonate", "Respiratory acidosis; it retains bicarbonate", "Metabolic alkalosis; it retains hydrogen ions", "Metabolic acidosis; it generates new bicarbonate"], "a": 0, "e": "Hypoxia drives hyperventilation through peripheral chemoreceptors, lowering PaCO₂ and causing respiratory alkalosis. Over days the kidney excretes bicarbonate to compensate. Acetazolamide speeds this and helps prevent altitude sickness."}, {"t": "Endocrine physiology", "c": "A 45-year-old woman has hypertension resistant to three drugs, muscle weakness and polyuria.", "l": [["Potassium", "2.9 mEq/L", "3.5–5.0", "lo"], ["Bicarbonate", "31 mEq/L", "22–28", "hi"], ["Aldosterone", "Elevated", "", "hi"]], "q": "Which additional finding is expected?", "o": ["Low plasma renin activity", "High plasma renin activity", "Low serum sodium", "Metabolic acidosis"], "a": 0, "e": "Primary hyperaldosteronism raises aldosterone independently of renin. Sodium retention expands volume and suppresses renin, while K⁺ and H⁺ are lost, causing hypokalemia and metabolic alkalosis. In renovascular disease renin is high."}, {"t": "Gastrointestinal physiology", "c": "A 22-year-old man has bloating, flatulence and watery diarrhea about an hour after drinking milk. Symptoms stop when he avoids dairy.", "l": [["Stool pH", "5.0", "5.5–7.0", "lo"], ["Breath hydrogen", "Elevated", "", "hi"], ["Stool osmotic gap", "Increased", "", "hi"]], "q": "Which mechanism explains his diarrhea?", "o": ["Lactase deficiency leaves lactose in the lumen, drawing water by osmosis", "Reduced chloride secretion in the colon", "Excess secretin stimulating pancreatic secretion", "Villous blunting from gluten-induced T cell injury"], "a": 0, "e": "Brush border lactase deficiency leaves lactose undigested. It is osmotically active and fermented by colonic bacteria, producing gas, short-chain fatty acids (low stool pH) and an osmotic diarrhea that resolves with fasting."}, {"t": "Renal physiology", "c": "A 62-year-old man with small cell lung cancer is confused. He appears euvolemic.", "l": [["Serum sodium", "121 mEq/L", "136–145", "lo"], ["Serum osmolality", "255 mOsm/kg", "275–295", "lo"], ["Urine osmolality", "480 mOsm/kg", "", "hi"], ["Urine sodium", "55 mEq/L", "", "hi"]], "q": "Which mechanism explains the hyponatremia?", "o": ["Excess ADH increases collecting duct water reabsorption through aquaporin-2, diluting serum sodium", "Reduced aldosterone causes renal sodium wasting", "Impaired sodium reabsorption in the thick ascending limb", "Primary polydipsia with maximally dilute urine"], "a": 0, "e": "This is SIADH, here from ectopic ADH production by the tumor. Inappropriate ADH causes water retention with euvolemic hyponatremia and concentrated urine. Treatment is fluid restriction, and correction must be slow to avoid osmotic demyelination."}, {"t": "Cardiac physiology", "c": "A 72-year-old man has exertional syncope and angina. He has a harsh crescendo-decrescendo systolic murmur radiating to the carotid arteries.", "l": [["Aortic valve area", "0.8 cm²", "3.0–4.0", "lo"], ["Peak valve gradient", "55 mmHg", "", "hi"], ["LV wall", "Thickened", "", "hi"]], "q": "Which myocardial adaptation to this lesion is expected?", "o": ["Sarcomeres added in parallel, causing concentric hypertrophy", "Sarcomeres added in series, causing eccentric hypertrophy", "Decreased wall thickness with reduced afterload", "Selective right ventricular hypertrophy"], "a": 0, "e": "Aortic stenosis causes pressure overload. The ventricle adds sarcomeres in parallel, thickening the wall to normalize wall stress (concentric hypertrophy). Volume overload instead adds sarcomeres in series and dilates the chamber."}], "Anatomy": [{"t": "Upper limb", "c": "A 70-year-old woman falls onto her shoulder and fractures the surgical neck of the humerus. In clinic she cannot abduct the arm past about 15 degrees.", "l": [["Abduction beyond 15°", "Weak", "", "lo"], ["Sensation, lateral upper arm", "Reduced", "", "lo"], ["Radial pulse", "Intact", "", ""]], "q": "Which nerve is most likely injured?", "o": ["Axillary nerve", "Radial nerve", "Musculocutaneous nerve", "Suprascapular nerve"], "a": 0, "e": "The axillary nerve (C5–C6) wraps around the surgical neck of the humerus. It supplies the deltoid and teres minor and the skin over the lateral shoulder. Radial nerve injury is typical of midshaft fractures at the spiral groove."}, {"t": "Upper limb", "c": "A 20-year-old man falls on his outstretched hand and has pain and tenderness in the anatomical snuffbox. Initial wrist X-rays look normal.", "l": [["Snuffbox tenderness", "Present", "", "hi"], ["Initial X-ray", "No fracture seen", "", ""], ["Neurovascular exam", "Normal", "", ""]], "q": "Which complication is most feared, and why?", "o": ["Avascular necrosis of the proximal pole, because blood enters the bone from distal to proximal", "Median nerve compression, because the nerve lies against the scaphoid", "Avascular necrosis of the distal pole, because blood enters proximally", "Ulnar artery occlusion, because it runs through the snuffbox"], "a": 0, "e": "Suspect a scaphoid fracture. The scaphoid receives most of its blood supply from the radial artery via branches entering distally, so a waist or proximal fracture can leave the proximal pole ischemic. Treat as a fracture and repeat imaging or use MRI."}, {"t": "Abdomen", "c": "A 55-year-old man with epigastric pain vomits bright red blood and then passes black, tarry stool. Endoscopy shows an ulcer on the posterior wall of the first part of the duodenum.", "l": [["Hemoglobin", "7.8 g/dL", "13.5–17.5", "lo"], ["Blood pressure", "92/58 mmHg", "", "lo"], ["Heart rate", "118 /min", "60–100", "hi"]], "q": "Which artery is most likely eroded?", "o": ["Gastroduodenal artery", "Splenic artery", "Left gastric artery", "Superior mesenteric artery"], "a": 0, "e": "The gastroduodenal artery runs directly behind the first part of the duodenum. A posterior duodenal ulcer can erode into it and cause major bleeding. An anterior ulcer is more likely to perforate."}, {"t": "Lower limb", "c": "A 26-year-old footballer is struck on the lateral side of the knee and fractures the neck of the fibula. He now catches his toes when walking.", "l": [["Ankle dorsiflexion", "Absent", "", "lo"], ["Foot eversion", "Weak", "", "lo"], ["Sensation, dorsum of foot", "Reduced", "", "lo"]], "q": "Which nerve is injured?", "o": ["Common fibular nerve", "Tibial nerve", "Femoral nerve", "Superior gluteal nerve"], "a": 0, "e": "The common fibular nerve winds around the fibular neck and is easily injured there. Loss of the dorsiflexors and evertors causes foot drop with a high-stepping gait. The tibial nerve supplies the plantar flexors."}, {"t": "Abdominal wall", "c": "A 3-month-old boy has an intermittent groin bulge when he cries. It extends into the scrotum and reduces when he is calm.", "l": [["Bulge location", "Lateral to the inferior epigastric vessels", "", ""], ["Transillumination", "Negative", "", ""]], "q": "Which embryologic structure explains this hernia?", "o": ["Patent processus vaginalis", "Weakness of the Hesselbach triangle", "Dilated femoral canal", "Obturator canal defect"], "a": 0, "e": "An indirect inguinal hernia passes through the deep inguinal ring, lateral to the inferior epigastric vessels, along a persistent processus vaginalis. Direct hernias bulge through the Hesselbach triangle and are acquired in older adults."}, {"t": "Thorax", "c": "A 62-year-old man has crushing chest pain. ECG shows ST elevation in leads II, III and aVF. His heart rate is 44 /min with first-degree AV block.", "l": [["ECG", "ST elevation II, III, aVF", "", "hi"], ["Heart rate", "44 /min", "60–100", "lo"], ["Troponin I", "Elevated", "", "hi"]], "q": "Which artery is most likely occluded?", "o": ["Right coronary artery", "Left anterior descending artery", "Left circumflex artery", "Left main coronary artery"], "a": 0, "e": "The right coronary artery supplies the inferior wall and, in most people, the SA and AV nodes, so inferior infarcts often cause bradycardia and heart block. In right-dominant hearts it gives off the posterior descending artery."}, {"t": "Head and neck", "c": "A 45-year-old woman is hoarse the day after a total thyroidectomy. Laryngoscopy shows an immobile left vocal cord.", "l": [["Voice", "Hoarse", "", "hi"], ["Left vocal cord", "Immobile", "", "lo"]], "q": "Which nerve, running close to the inferior thyroid artery, was most likely injured?", "o": ["Recurrent laryngeal nerve", "External branch of the superior laryngeal nerve", "Hypoglossal nerve", "Glossopharyngeal nerve"], "a": 0, "e": "The recurrent laryngeal nerve ascends in the tracheoesophageal groove near the inferior thyroid artery and supplies all intrinsic laryngeal muscles except the cricothyroid. The external superior laryngeal branch, near the superior thyroid artery, affects pitch."}, {"t": "Neuroanatomy", "c": "A newborn is delivered after shoulder dystocia. The right arm hangs limp, adducted and medially rotated, with the forearm extended and pronated. Grip is preserved.", "l": [["Shoulder abduction", "Absent", "", "lo"], ["Elbow flexion", "Absent", "", "lo"], ["Hand grip", "Normal", "", ""]], "q": "Which nerve roots are injured?", "o": ["C5–C6", "C8–T1", "C7 only", "T1 only"], "a": 0, "e": "Upper trunk (Erb) palsy involves C5–C6, weakening the deltoid, supraspinatus, biceps and brachialis, giving the waiter’s tip posture. Hand function is spared. Klumpke palsy involves C8–T1 and affects the hand."}, {"t": "Abdomen", "c": "A 55-year-old man with alcohol-related cirrhosis vomits a large volume of blood. Endoscopy shows dilated submucosal veins in the distal esophagus.", "l": [["Platelets", "85,000 /µL", "150,000–400,000", "lo"], ["INR", "1.9", "0.9–1.1", "hi"], ["Portal pressure", "Elevated", "", "hi"]], "q": "Which portal–systemic venous anastomosis is the source?", "o": ["Left gastric veins and esophageal veins of the azygos system", "Superior rectal and inferior rectal veins", "Paraumbilical and superficial epigastric veins", "Colic veins and retroperitoneal veins"], "a": 0, "e": "Portal hypertension diverts blood from the left gastric vein into esophageal veins draining to the azygos system, forming varices. Rectal anastomoses cause hemorrhoids and paraumbilical veins cause caput medusae."}, {"t": "Thorax", "c": "A 64-year-old man is breathless when lying flat the day after coronary bypass surgery. Chest X-ray shows an elevated left hemidiaphragm.", "l": [["Left hemidiaphragm", "Elevated, paradoxical movement", "", "hi"], ["SpO₂ supine", "90%", "", "lo"]], "q": "Which nerve roots contribute to the injured nerve?", "o": ["C3–C5", "C1–C2", "C6–C7", "T1–T2"], "a": 0, "e": "The phrenic nerve (C3–C5, “C3, 4, 5 keeps the diaphragm alive”) is the sole motor supply to the diaphragm. It can be injured by cold cardioplegia, surgery or tumors, causing an elevated hemidiaphragm."}, {"t": "Pelvis", "c": "A 28-year-old woman in labor requests anesthesia of the perineum. The obstetrician injects local anesthetic near the ischial spine.", "l": [["Target region", "Perineum and vulva", "", ""], ["Landmark", "Ischial spine", "", ""]], "q": "Which nerve is blocked, and what are its roots?", "o": ["Pudendal nerve, S2–S4", "Obturator nerve, L2–L4", "Sciatic nerve, L4–S3", "Ilioinguinal nerve, L1"], "a": 0, "e": "The pudendal nerve (S2–S4) leaves the pelvis through the greater sciatic foramen, passes around the ischial spine and returns through the lesser sciatic foramen. A block at the spine anesthetizes the perineum."}, {"t": "Upper limb", "c": "A 45-year-old typist has night-time tingling from thumb to ring finger and weak thumb opposition. Thenar muscles are wasted. Phalen test is positive.", "l": [["Thumb abduction", "Weak", "", "lo"], ["Sensation, palmar thumb to ring finger", "Reduced", "", "lo"], ["Thenar bulk", "Reduced", "", "lo"]], "q": "Which thumb muscle is spared in this condition?", "o": ["Adductor pollicis", "Abductor pollicis brevis", "Opponens pollicis", "Flexor pollicis brevis, superficial head"], "a": 0, "e": "Carpal tunnel syndrome compresses the median nerve, affecting the thenar muscles and the first two lumbricals. Adductor pollicis is supplied by the ulnar nerve, so it is spared."}, {"t": "Head and neck", "c": "A 30-year-old man has fever, severe headache, bilateral periorbital swelling and proptosis after squeezing a facial boil. He cannot abduct his right eye.", "l": [["Temperature", "39.4 °C", "", "hi"], ["Right eye abduction", "Absent", "", "lo"], ["Proptosis", "Present", "", "hi"]], "q": "Which structure is usually affected first within the cavernous sinus?", "o": ["Abducens nerve", "Oculomotor nerve", "Trochlear nerve", "Maxillary nerve"], "a": 0, "e": "Cavernous sinus thrombosis follows spread of infection through facial veins. The abducens nerve (CN VI) runs freely through the sinus beside the internal carotid artery, while CN III, IV, V₁ and V₂ lie in the lateral wall."}], "Pathology": [{"t": "Cardiovascular pathology", "c": "A 60-year-old man with an anterior ST-elevation myocardial infarction dies of ventricular fibrillation about 48 hours after symptom onset.", "l": [["Troponin I", "Markedly elevated", "", "hi"], ["ECG", "ST elevation, anterior leads", "", "hi"], ["Time since onset", "About 48 hours", "", ""]], "q": "Which histologic finding is expected in the infarcted myocardium?", "o": ["Coagulative necrosis with a dense neutrophilic infiltrate", "Macrophages and early granulation tissue", "Dense collagenous scar", "Wavy fibers only, with no inflammation"], "a": 0, "e": "Neutrophils peak at about 1–3 days after infarction. Macrophages and granulation tissue dominate at 3–14 days and scar forms after about 2 months. Wavy fibers are the earliest change, at 1–4 hours."}, {"t": "Hematopathology", "c": "A 45-year-old man has fatigue, early satiety and left upper quadrant fullness. Examination shows splenomegaly. A smear shows granulocytes at all stages of maturation.", "l": [["WBC", "150,000 /µL", "4,000–11,000", "hi"], ["Basophils", "Increased", "", "hi"], ["Leukocyte alkaline phosphatase", "Low", "", "lo"]], "q": "Which genetic abnormality is most likely?", "o": ["t(9;22) BCR-ABL1", "t(15;17) PML-RARA", "t(8;14) MYC-IGH", "t(14;18) BCL2-IGH"], "a": 0, "e": "This is chronic myeloid leukemia. The Philadelphia chromosome produces a constitutively active BCR-ABL1 tyrosine kinase, which is targeted by imatinib. The other translocations cause APL, Burkitt lymphoma and follicular lymphoma."}, {"t": "Renal pathology", "c": "An 8-year-old boy develops cola-colored urine, periorbital edema and hypertension two weeks after a skin infection.", "l": [["Urinalysis", "Hematuria, red cell casts", "", "hi"], ["C3", "Low", "", "lo"], ["Blood pressure", "150/95 mmHg", "", "hi"], ["Anti-DNase B", "Elevated", "", "hi"]], "q": "Which electron microscopy finding is expected?", "o": ["Subepithelial immune complex humps", "Basement membrane splitting with a basket-weave pattern", "Effacement of podocyte foot processes only", "Subendothelial deposits with tram-track basement membrane"], "a": 0, "e": "This is post-streptococcal glomerulonephritis. Immune complex deposition produces subepithelial humps on EM and a lumpy-bumpy granular pattern on immunofluorescence. Basket-weave splitting is Alport syndrome and foot process effacement alone is minimal change disease."}, {"t": "Respiratory pathology", "c": "A 66-year-old heavy smoker has cough and hemoptysis. CT shows a central hilar mass. He is confused and constipated.", "l": [["Calcium", "12.8 mg/dL", "8.5–10.5", "hi"], ["PTH", "Low", "", "lo"], ["PTHrP", "Elevated", "", "hi"]], "q": "Which histologic finding is expected?", "o": ["Keratin pearls and intercellular bridges", "Glandular structures with mucin", "Small blue cells with scant cytoplasm", "Large anaplastic cells without differentiation"], "a": 0, "e": "Central tumors in smokers with PTHrP-mediated hypercalcemia are typically squamous cell carcinomas, which show keratin pearls and intercellular bridges. Small cell carcinoma is central too but causes ADH or ACTH syndromes."}, {"t": "Endocrine pathology", "c": "A 40-year-old woman has fatigue, weight gain and cold intolerance. She has a firm, nontender, diffusely enlarged thyroid.", "l": [["TSH", "12 mU/L", "0.4–4.0", "hi"], ["Free T4", "Low", "", "lo"], ["Anti-TPO antibodies", "Positive", "", "hi"]], "q": "Which histologic finding is expected?", "o": ["Lymphocytic infiltrate with germinal centers and Hürthle cells", "Granulomas with multinucleated giant cells", "Dense fibrosis extending into surrounding neck tissue", "Papillary fronds with psammoma bodies"], "a": 0, "e": "Hashimoto thyroiditis shows a dense lymphoplasmacytic infiltrate with germinal centers and oncocytic Hürthle cells. Granulomas suggest subacute thyroiditis, Riedel thyroiditis shows fibrosis, and psammoma bodies suggest papillary carcinoma."}, {"t": "Gastrointestinal pathology", "c": "A 24-year-old woman has right lower quadrant pain, diarrhea, weight loss and a perianal fistula. Imaging shows narrowing of the terminal ileum.", "l": [["CRP", "Elevated", "", "hi"], ["Hemoglobin", "10.2 g/dL", "12–16", "lo"], ["Ileocolonoscopy", "Skip lesions", "", ""]], "q": "Which histologic feature is most characteristic?", "o": ["Transmural inflammation with noncaseating granulomas", "Mucosal inflammation with crypt abscesses only", "Continuous inflammation from the rectum", "Pseudopolyps with submucosal sparing"], "a": 0, "e": "Crohn disease causes transmural inflammation, skip lesions, fistulas and noncaseating granulomas, most often in the terminal ileum. Ulcerative colitis is mucosal, continuous from the rectum and forms pseudopolyps."}, {"t": "Hepatic pathology", "c": "A 50-year-old man with heavy long-term alcohol use has jaundice, fever and tender hepatomegaly.", "l": [["AST", "220 U/L", "10–40", "hi"], ["ALT", "95 U/L", "7–56", "hi"], ["GGT", "Elevated", "", "hi"], ["Bilirubin", "4.5 mg/dL", "0.1–1.2", "hi"]], "q": "Which hepatocyte finding is expected on biopsy?", "o": ["Mallory-Denk bodies", "Councilman bodies", "Ground-glass hepatocytes", "Diastase-resistant PAS-positive globules"], "a": 0, "e": "Alcoholic hepatitis shows ballooned hepatocytes with Mallory-Denk bodies (damaged cytokeratin), neutrophils and steatosis. The AST to ALT ratio is typically above 2. Councilman bodies suggest viral hepatitis."}, {"t": "Cardiac pathology", "c": "A 10-year-old girl has migratory joint pain and a new murmur three weeks after streptococcal pharyngitis. She has painless subcutaneous nodules.", "l": [["ASO titer", "Elevated", "", "hi"], ["ESR", "Elevated", "", "hi"], ["Echocardiogram", "Mitral regurgitation", "", "hi"]], "q": "Which cardiac lesion is characteristic?", "o": ["Aschoff bodies with Anitschkow cells", "Sterile vegetations on both sides of the valve", "Caseating granulomas", "Intracytoplasmic Negri bodies"], "a": 0, "e": "Acute rheumatic fever causes pancarditis with Aschoff bodies, which are granulomas containing Anitschkow cells. It follows group A streptococcal infection through molecular mimicry. Libman-Sacks vegetations occur in lupus."}, {"t": "Hematopathology", "c": "A 24-year-old woman has painless cervical lymphadenopathy, night sweats and itching. Biopsy shows large binucleate cells with owl-eye nuclei in an inflammatory background.", "l": [["ESR", "Elevated", "", "hi"], ["Chest X-ray", "Mediastinal widening", "", "hi"], ["LDH", "Elevated", "", "hi"]], "q": "Which immunophenotype do the large cells show?", "o": ["CD15 and CD30 positive", "CD20 and CD5 positive", "CD10 and CD19 positive", "TdT positive"], "a": 0, "e": "Reed-Sternberg cells of classical Hodgkin lymphoma express CD15 and CD30 and are usually CD45 negative. Mantle cell lymphoma is CD5 and CD20 positive, and TdT marks lymphoblastic leukemia or lymphoma."}, {"t": "Neuropathology", "c": "A 62-year-old man has several weeks of headaches and personality change. MRI shows a ring-enhancing mass crossing the corpus callosum.", "l": [["MRI", "Butterfly lesion with central necrosis", "", "hi"], ["GFAP stain", "Positive", "", "hi"]], "q": "Which histologic feature is characteristic?", "o": ["Pseudopalisading necrosis with endothelial proliferation", "Whorled cells with psammoma bodies", "Fried-egg cells with chicken-wire capillaries", "Rosenthal fibers with a biphasic pattern"], "a": 0, "e": "Glioblastoma is a grade 4 astrocytoma with pseudopalisading necrosis and microvascular proliferation. Whorls with psammoma bodies suggest meningioma, fried-egg cells oligodendroglioma, and Rosenthal fibers pilocytic astrocytoma."}, {"t": "Renal pathology", "c": "A 5-year-old boy has periorbital swelling and frothy urine two weeks after a cold. Light microscopy of a renal biopsy is normal.", "l": [["Urine protein", "4+", "", "hi"], ["Serum albumin", "1.8 g/dL", "3.5–5.0", "lo"], ["Serum cholesterol", "Elevated", "", "hi"]], "q": "Which electron microscopy finding is expected?", "o": ["Diffuse effacement of podocyte foot processes", "Subepithelial immune complex humps", "Subendothelial deposits with tram-track basement membrane", "Basement membrane thinning with splitting"], "a": 0, "e": "Minimal change disease is the commonest childhood nephrotic syndrome. Light microscopy and immunofluorescence are normal, EM shows foot process effacement, and it responds well to corticosteroids."}, {"t": "Gastrointestinal pathology", "c": "A 58-year-old man has fatigue and iron deficiency. Colonoscopy shows an ulcerating mass in the cecum, and biopsy confirms adenocarcinoma.", "l": [["Hemoglobin", "9.0 g/dL", "13.5–17.5", "lo"], ["MCV", "72 fL", "80–100", "lo"], ["Fecal occult blood", "Positive", "", "hi"]], "q": "Which genetic event occurs earliest in the adenoma-carcinoma sequence?", "o": ["APC inactivation", "KRAS activation", "TP53 inactivation", "SMAD4 loss"], "a": 0, "e": "Loss of APC, a regulator of β-catenin, starts the sequence by forming adenomas. KRAS mutation, then TP53 loss, drives progression to carcinoma. Right-sided cancers often present with occult bleeding and anemia."}, {"t": "Immunopathology", "c": "A 25-year-old woman has a malar rash sparing the nasolabial folds, joint pain and photosensitivity. Urinalysis shows protein 3+.", "l": [["ANA", "Positive", "", "hi"], ["C3", "Low", "", "lo"], ["Urine protein", "3+", "", "hi"]], "q": "Which antibody is most specific for her diagnosis?", "o": ["Anti-Smith", "Antinuclear antibody", "Anti-histone", "Anti-centromere"], "a": 0, "e": "Anti-Smith and anti-dsDNA are specific for SLE, while ANA is sensitive but not specific. Anti-histone is typical of drug-induced lupus and anti-centromere points to limited scleroderma. Lupus nephritis is a type III hypersensitivity."}], "Microbiology": [{"t": "Bacteriology", "c": "A 19-year-old college student living in a dormitory has fever, severe headache, neck stiffness and a petechial rash. CSF Gram stain shows Gram-negative diplococci.", "l": [["CSF WBC", "3,200 /µL, mostly neutrophils", "0–5", "hi"], ["CSF glucose", "20 mg/dL", "45–80", "lo"], ["CSF protein", "210 mg/dL", "15–45", "hi"]], "q": "Which drug is appropriate prophylaxis for his roommates?", "o": ["Rifampin", "Vancomycin", "Penicillin V", "Doxycycline"], "a": 0, "e": "Neisseria meningitidis spreads by respiratory droplets, so close contacts need prophylaxis with rifamp  else if(s===1){x+="<rect x='46' y='80' width='148' height='38' fill='"+st+"'/><rect x='92' y='58' width='56' height='22' fill='"+st+"'/><path d='M92 58 Q120 14 148 58Z' fill='"+ac+"'/><rect x='116' y='8' width='8' height='14' fill='"+dk+"'/>";for(i=0;i<6;i++)x+="<rect x='"+(56+i*24)+"' y='92' width='10' height='20' rx='5' fill='"+dk+"'/>"}
 else if(s===2){x+="<rect x='26' y='84' width='64' height='34' fill='"+st+"'/><rect x='150' y='84' width='64' height='34' fill='"+st+"'/><rect x='96' y='42' width='48' height='76' fill='"+st+"'/><polygon points='94,42 120,6 146,42' fill='"+dk+"'/><path d='M112 118 v-24 q8-14 16 0 v24z' fill='"+dk+"'/>";for(i=0;i<3;i++)x+="<rect x='"+(34+i*20)+"' y='94' width='8' height='14' fill='"+dk+"'/><rect x='"+(158+i*20)+"' y='94' width='8' height='14' fill='"+dk+"'/>"}
 else if(s===3){x+="<rect x='34' y='72' width='96' height='46' fill='"+st+"' stroke='"+dk+"'/><rect x='104' y='36' width='100' height='82' fill='"+st+"' stroke='"+dk+"'/>";for(i=0;i<5;i++)x+="<rect x='"+(112+i*18)+"' y='44' width='12' height='64' fill='"+ac+"' opacity='.55'/>";for(i=0;i<4;i++)x+="<rect x='"+(42+i*22)+"' y='80' width='14' height='30' fill='"+ac+"' opacity='.55'/>"}
 else{x+="<rect x='64' y='92' width='112' height='26' fill='"+st+"'/><polygon points='52,92 188,92 170,76 70,76' fill='"+dk+"'/><rect x='84' y='62' width='72' height='14' fill='"+st+"'/><polygon points='74,62 166,62 150,46 90,46' fill='"+dk+"'/><rect x='104' y='34' width='32' height='12' fill='"+st+"'/><polygon points='96,34 144,34 128,18 112,18' fill='"+ac+"'/>"}
 return"<svg viewBox='0 0 240 140' role='img' aria-label='Stylized illustration of a medical school building' xmlns='http://www.w3.org/2000/svg'><rect width='240' height='140' fill='"+sky+"'/><rect y='118' width='240' height='22' fill='"+gr+"'/><circle cx='200' cy='26' r='10' fill='hsl(45,90%,75%)'/>"+x+"<circle cx='20' cy='108' r='11' fill='hsl(135,32%,36%)'/><circle cx='222' cy='108' r='11' fill='hsl(135,32%,36%)'/></svg>"}

function setNav(){document.querySelectorAll('#nav button').forEach(function(b){var on=(b.dataset.nav==='home'&&view==='home')||(b.dataset.nav==='menu'&&view!=='home');if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function allPool(){return NAMES.reduce(function(a,n){return a.concat(DATA[n])},[])}
function home(){
 run=null;view='home';prog.style.width='0';meta.textContent='';setNav();
 var total=allPool().length,att=0,best=0;

 app.innerHTML=`<section class='hero'><p class='topic'>Version 1.2</p><h2>Practice clinical reasoning, one vignette at a time</h2><p class='case'>${total} case-based questions in biochemistry, physiology, anatomy, pathology and microbiology, each with findings and a worked explanation.</p><div class='row' style='justify-content:flex-start;flex-wrap:wrap'><button type='button' class='btn' data-quick='1'>Quick quiz: 10 mixed questions</button><button type='button' class='btn ghost' data-nav='menu'>Choose subjects</button></div><div class='stats'><div><b>${total}</b><span>questions</span></div><div><b>${NAMES.length}</b><span>subjects</span></div><div><b>${att}</b><span>quizzes taken</span></div><div><b>${att?best+'%':'None yet'}</b><span>best score</span></div></div></section><h3 class='sec'>Start with a subject</h3><div class='chips'>${NAMES.map(function(n){return`<button type='button' class='chip' data-go='${n}'>${n}<small>${DATA[n].length}</small></button>`}).join('')}</div><h3 class='sec'>Medical schools around the world</h3><div class='schools'>${SCHOOLS.map(function(s){return`<figure class='school'>${art(s[3],s[4])}<figcaption class='body'><h3>${s[0]}</h3><p class='meta'>${s[1]}, founded ${s[2]}</p><blockquote>${s[5]}<cite>${s[6]}</cite></blockquote></figcaption></figure>`}).join('')}</div><p class='meta note'>Illustrations are stylized artwork, not photographs of the buildings. Quotes are traditional attributions, so check the source before citing them.</p>`;
}

if(matchMedia('(prefers-color-scheme: dark)').matches)tb.textContent='Light';
home();
